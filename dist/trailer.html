<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#031426">
  <title>Meridian — Cinematic Trailer</title>
  <link rel="stylesheet" href="trailer.css">
</head>
<body>
  <main>
    <div class="stage" aria-label="Meridian cinematic trailer">
      <canvas id="trailer" width="1920" height="1080"></canvas>
      <button id="playButton" class="center-play" type="button" aria-label="Play trailer">
        <span aria-hidden="true">▶</span>
      </button>
    </div>
    <section class="controls" aria-label="Trailer controls">
      <button id="restartButton" type="button">Restart</button>
      <button id="soundButton" type="button" aria-pressed="false">Sound off</button>
      <button id="exportButton" class="primary" type="button">Render video</button>
      <div class="time"><span id="timeLabel">0:00</span><input id="scrubber" type="range" min="0" max="38" step="0.01" value="0" aria-label="Trailer position"><span>0:38</span></div>
      <p id="status" role="status">Ready. The trailer is 38 seconds.</p>
    </section>
    <details>
      <summary>Trailer credits</summary>
      <p>The interface and reading landscape are Meridian project assets. Object images use the existing source and reuse records in Meridian. The soundtrack is generated in the browser.</p>
    </details>
  </main>
  <script type="module" src="trailer.js"></script>
</body>
</html>
